[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metabric-survival"
version = "1.0.0"
description = "Leakage-audited survival analysis of the METABRIC breast cancer cohort"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Melih Can Orel" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::UserWarning"]
